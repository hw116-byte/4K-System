<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 650" width="1060" height="650"><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172a32}
.t{font-size:13px}.s{font-size:11.5px}.xs{font-size:10.5px;fill:#53656b}.b{font-weight:700}.m{font-family:Menlo,monospace;font-size:11px}
.ttl{font-size:15px;font-weight:700}
.ln{stroke:#172a32;stroke-width:1.2;fill:none}.ln2{stroke:#172a32;stroke-width:2.2;fill:none}.dl{stroke:#126a71;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.grp{fill:none;stroke:#93aeb0;stroke-width:1.2;stroke-dasharray:6 4}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#172a32"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#126a71"/></marker></defs><rect width="1060" height="650" fill="#fff"/><text x="20" y="28" class="ttl">Power-up order of one head: what switches on what (Frontend V13 netlist; not to scale)</text><rect x="20" y="60" width="130" height="52" rx="6" fill="#f1f4f4" stroke="#8a9a9e" stroke-width="1.3"/><text x="85.0" y="82.0" text-anchor="middle" class="t b">Cable 5 V</text><text x="85.0" y="98.0" text-anchor="middle" class="s">VIN_5V</text><rect x="190" y="60" width="150" height="52" rx="6" fill="#e8eff4" stroke="#3d6a86" stroke-width="1.3"/><text x="265.0" y="82.0" text-anchor="middle" class="t b">VIN_3V3 3.3 V</text><text x="265.0" y="98.0" text-anchor="middle" class="s">U16 (EN tied to 5 V)</text><rect x="390" y="60" width="150" height="52" rx="6" fill="#eaf4f3" stroke="#126a71" stroke-width="1.3"/><text x="465.0" y="82.0" text-anchor="middle" class="t b">VCCINT 1.0 V</text><text x="465.0" y="98.0" text-anchor="middle" class="s">U2 (EN tied to 3.3 V)</text><rect x="630" y="60" width="150" height="52" rx="6" fill="#eaf4f3" stroke="#126a71" stroke-width="1.3"/><text x="705.0" y="82.0" text-anchor="middle" class="t b">VCCAUX 1.8 V</text><text x="705.0" y="98.0" text-anchor="middle" class="s">U3</text><rect x="870" y="60" width="150" height="52" rx="6" fill="#eaf4f3" stroke="#126a71" stroke-width="1.3"/><text x="945.0" y="82.0" text-anchor="middle" class="t b">VCCO 1.5 V</text><text x="945.0" y="98.0" text-anchor="middle" class="s">U4</text><polyline points="150,86 188,86" class="ln" marker-end="url(#a)"/><polyline points="340,86 388,86" class="ln" marker-end="url(#a)"/><polyline points="540,86 628,86" class="ln" marker-end="url(#a)"/><text x="585" y="79" text-anchor="middle" class="xs">PG_CORE_1V0</text><polyline points="780,86 868,86" class="ln" marker-end="url(#a)"/><text x="824" y="79" text-anchor="middle" class="xs">PG_AUX_1V8</text><rect x="20" y="176" width="330" height="64" rx="6" fill="#eef4e8" stroke="#5a8442" stroke-width="1.3"/><text x="185.0" y="196.0" text-anchor="middle" class="t b">9 ASIC rails (FPGA-LDO board)</text><text x="185.0" y="212.0" text-anchor="middle" class="s">15–23 ms after VIN_3V3: EN_ASIC_RAILS</text><text x="185.0" y="228.0" text-anchor="middle" class="s">RC delay, R1 10 kΩ and C3 4.7 µF</text><polyline points="265,112 265,174" class="ln" marker-end="url(#a)"/><rect x="390" y="176" width="150" height="64" rx="6" fill="#e8eff4" stroke="#3d6a86" stroke-width="1.3"/><text x="465.0" y="204.0" text-anchor="middle" class="t b">SWITCHED_3V3</text><text x="465.0" y="220.0" text-anchor="middle" class="s">U10 load switch</text><circle cx="580" cy="86" r="3" fill="#172a32"/><polyline points="580,86 580,192 542,192" class="ln" marker-end="url(#a)"/><rect x="615" y="176" width="180" height="64" rx="6" fill="#ffffff" stroke="#172a32" stroke-width="1.3"/><text x="705.0" y="196.0" text-anchor="middle" class="t b">U15 level shifter</text><text x="705.0" y="212.0" text-anchor="middle" class="s">powered by VCCO</text><text x="705.0" y="228.0" text-anchor="middle" class="s">and SWITCHED_3V3</text><polyline points="540,224 613,224" class="ln" marker-end="url(#a)"/><text x="577" y="218" text-anchor="middle" class="xs">supply</text><rect x="870" y="176" width="150" height="64" rx="6" fill="#ffffff" stroke="#172a32" stroke-width="1.3"/><text x="945.0" y="196.0" text-anchor="middle" class="t b">FPGA pin M15</text><text x="945.0" y="212.0" text-anchor="middle" class="s">EN_GTPWR_1V5 high:</text><text x="945.0" y="228.0" text-anchor="middle" class="s">R58 4.99 kΩ to VCCO</text><polyline points="945,112 945,174" class="ln" marker-end="url(#a)"/><polyline points="870,208 797,208" class="ln" marker-end="url(#a)"/><rect x="615" y="296" width="180" height="64" rx="6" fill="#eaf4f3" stroke="#126a71" stroke-width="1.3"/><text x="705.0" y="316.0" text-anchor="middle" class="t b">1V4_GTP_IN 1.4 V</text><text x="705.0" y="332.0" text-anchor="middle" class="s">U13, EN = EN_GTPWR_3V3</text><text x="705.0" y="348.0" text-anchor="middle" class="s">(R57 10 kΩ pull-down)</text><polyline points="705,240 705,294" class="ln" marker-end="url(#a)"/><rect x="390" y="300" width="150" height="56" rx="6" fill="#eaf4f3" stroke="#126a71" stroke-width="1.3"/><text x="465.0" y="324.0" text-anchor="middle" class="t b">MGTAVCC 1.0 V</text><text x="465.0" y="340.0" text-anchor="middle" class="s">U5</text><polyline points="615,328 542,328" class="ln" marker-end="url(#a)"/><text x="578" y="321" text-anchor="middle" class="xs">PG_GTP_1V4</text><rect x="300" y="410" width="420" height="60" rx="6" fill="#ffffff" stroke="#172a32" stroke-width="1.3"/><text x="510.0" y="428.0" text-anchor="middle" class="t b">BOOT_RAILS_PG_3V3</text><text x="510.0" y="444.0" text-anchor="middle" class="s">U4 PG and U5 PG wired together, R9 4.99 kΩ pull-up:</text><text x="510.0" y="460.0" text-anchor="middle" class="s">high only when VCCO and MGTAVCC are both good</text><polyline points="465,356 465,408" class="ln" marker-end="url(#a)"/><text x="470" y="386" text-anchor="start" class="xs">U5 PG</text><polyline points="1020,86 1042,86 1042,440 722,440" class="ln" marker-end="url(#a)"/><text x="1030" y="433" text-anchor="end" class="xs">U4 PG (VCCO good)</text><rect x="20" y="530" width="200" height="56" rx="6" fill="#eaf4f3" stroke="#126a71" stroke-width="1.3"/><text x="120.0" y="554.0" text-anchor="middle" class="t b">MGTAVTT 1.2 V</text><text x="120.0" y="570.0" text-anchor="middle" class="s">U6 (its PG is not used)</text><polyline points="380,470 380,500 120,500 120,528" class="ln" marker-end="url(#a)"/><text x="250" y="494" text-anchor="middle" class="xs">U6 EN</text><rect x="300" y="526" width="280" height="64" rx="6" fill="#ffffff" stroke="#172a32" stroke-width="1.3"/><text x="440.0" y="546.0" text-anchor="middle" class="t b">U12 reset supervisor</text><text x="440.0" y="562.0" text-anchor="middle" class="s">MR (pin 3) = BOOT_RAILS_PG_3V3</text><text x="440.0" y="578.0" text-anchor="middle" class="s">SENSE (pin 1) = VCCAUX via R45/R46</text><polyline points="470,470 470,524" class="ln" marker-end="url(#a)"/><text x="476" y="500" text-anchor="start" class="xs">U12 MR</text><rect x="680" y="526" width="340" height="64" rx="6" fill="#eaf4f3" stroke="#126a71" stroke-width="1.3"/><text x="850.0" y="546.0" text-anchor="middle" class="t b">FPGA configures from flash U7</text><text x="850.0" y="562.0" text-anchor="middle" class="s">after U12 delay: BOOT_RESET_N, U11</text><text x="850.0" y="578.0" text-anchor="middle" class="s">releases PROGRAM_B and INIT_B</text><polyline points="580,558 678,558" class="ln" marker-end="url(#a)"/><text x="20" y="618" text-anchor="start" class="xs">MGTAVTT and the reset delay start at the same moment; the reset does not wait for MGTAVTT. Arrows: enable and power-good wires in the netlist.</text><text x="20" y="636" text-anchor="start" class="xs">Firmware must drive M15 high (R58 alone loses to a pin pull-down): M15 low turns U13 off, U5 loses its input, BOOT_RAILS_PG_3V3 falls and U12 resets the FPGA.</text></svg>